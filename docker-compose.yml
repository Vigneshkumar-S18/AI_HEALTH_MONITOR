version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medflow_postgres
    restart: always
    environment:
      POSTGRES_USER: medflow_user
      POSTGRES_PASSWORD: medflow_password
      POSTGRES_DB: medflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medflow_user -d medflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medflow_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medflow_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://medflow_user:medflow_password@postgres:5432/medflow_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_medflow_jwt_key_2026_production
      JWT_REFRESH_SECRET: super_secret_medflow_refresh_key_2026
      CORS_ORIGIN: "http://localhost:3000,http://localhost:80"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medflow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
